; vwise-cloud-core 配置（ini 风格，零依赖）
; 注释以 ; 开头

[server]
; 锚点监听列表（逗号分隔 host[:port]，多个锚点 = 模拟多 PoP）。
; 本机 Windows 联调默认：两个端口模拟两个 PoP 锚点。
anchors = 0.0.0.0:39001, 0.0.0.0:39002
; 统计打印周期（秒）
stats_interval_sec = 2

[mqtt]
; 控制面（链路状态订阅/模式指令发布）。联调需本机 mosquitto：
;   Windows 安装 mosquitto 后在 mosquitto.conf 中设置 listener 1883 / allow_anonymous true
enable = 0
host = 127.0.0.1
port = 1883
client_id = vwise_cloud_core
; 订阅终端链路状态上报（+ 通配 imei）
status_filter = vwise/+/link/status/up
; 模式指令发布前缀（vwise/<imei>/link/mode/down）
mode_prefix = vwise/

[downlink]
; 下行模式：off | best | dual | auto
mode = dual
rate_pps = 50
payload_bytes = 200
flow_id = 0x5100

[web]
; 内嵌 Web 看板（测试联调专用，局域网访问，无鉴权）
enable = 1
port = 8080
www_dir = www

[log]
; 0=debug 1=info 2=warn 3=error
level = 1
